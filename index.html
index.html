<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AA Reels - Short Videos Platform</title>
<meta name="description" content="AA Reels - તમારા મનપસંદ શોર્ટ વીડિયો જુઓ અને અપલોડ કરો.">
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;font-family:Arial,sans-serif}
header{position:sticky;top:0;background:#181818;padding:14px;display:flex;justify-content:space-between;align-items:center;z-index:5;border-bottom:1px solid #333}
.logo{font-size:23px;font-weight:bold;color:#ff375f}
button{border:0;border-radius:9px;padding:10px 14px;font-weight:bold;cursor:pointer}
.upload{background:#ff375f;color:white}
main{max-width:520px;margin:auto;padding:12px}
.notice{font-size:13px;color:#bbb;text-align:center;padding:10px}
.card{background:#202020;border-radius:14px;overflow:hidden;margin:14px 0 22px}
video{display:block;width:100%;max-height:70vh;background:#000;object-fit:contain}
.details{padding:12px}
.title{font-size:17px;font-weight:bold;margin-bottom:7px}
.desc{color:#ccc;font-size:14px;overflow-wrap:anywhere}
.actions{display:flex;gap:10px;margin-top:12px;align-items:center}
.like{background:#333;color:white}
.like.active{background:#ff375f}
.delete{background:#333;color:#ff9aaa;margin-left:auto}
.empty{text-align:center;color:#aaa;padding:50px 12px}
dialog{background:#202020;color:white;border:1px solid #555;border-radius:15px;width:calc(100% - 30px);max-width:420px}
dialog::backdrop{background:#000b}
input,textarea{width:100%;padding:12px;margin:7px 0 12px;border-radius:8px;border:1px solid #555;background:#111;color:white}
label{font-size:14px}
.row{display:flex;gap:8px}
.row button{flex:1}
.cancel{background:#444;color:white}
footer{text-align:center;color:#888;padding:25px;font-size:12px}
</style>
</head>
<body>
<header>
  <div class="logo">▶ AA Reels</div>
  <button class="upload" id="openUpload">＋ Upload</button>
</header>

<main>
  <div class="notice">તમારા મનપસંદ શોર્ટ વીડિયો જુઓ 🎬</div>
  <div id="feed">
    <div class="empty">હજુ કોઈ વીડિયો નથી.<br>＋ Upload દબાવીને વીડિયો ઉમેરો.</div>
  </div>
</main>
<footer>© AA Reels - Gadhada</footer>

<dialog id="uploadDialog">
  <form id="uploadForm">
    <h2>નવો Reel ઉમેરો</h2>
    <label for="videoTitle">વીડિયોનું નામ</label>
    <input id="videoTitle" maxlength="80" required placeholder="વીડિયાનું નામ">
    <label for="videoDesc">વર્ણન</label>
    <textarea id="videoDesc" maxlength="300" placeholder="વીડિયા વિશે લખો"></textarea>
    <label for="videoFile">વીડિયો પસંદ કરો (20 MB સુધી)</label>
    <input id="videoFile" type="file" accept="video/*" required>
    <div class="row" style="margin-top:15px;">
      <button type="submit" class="upload">વીડિયો ઉમેરો</button>
      <button type="button" class="cancel" id="closeUpload">રદ કરો</button>
    </div>
  </form>
</dialog>

<!-- Firebase SDKs (Modular Version) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, arrayUnion, arrayRemove, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

  // TODO: તમારા ફાયરબેઝ કન્ફિગ અહીં ઉમેરો
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);

  let currentUser = null;
  const ADMIN_UID = "YOUR_ADMIN_UID"; // તમારું એડમિન યુઝર આઈડી અહીં મૂકો

  // Anonymous Login જેથી દરેક યૂઝરને યુનિક આઈડી મળે
  signInAnonymously(auth).catch((error) => {
    console.error("Auth error:", error);
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      loadReels();
    }
  });

  const dialog = document.getElementById('uploadDialog');
  const form = document.getElementById('uploadForm');
  const feed = document.getElementById('feed');

  document.getElementById('openUpload').onclick = () => dialog.showModal();
  document.getElementById('closeUpload').onclick = () => dialog.close();

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    const file = document.getElementById('videoFile').files[0];
    const title = document.getElementById('videoTitle').value.trim();
    const desc = document.getElementById('videoDesc').value.trim();

    if(!file || !file.type.startsWith('video/')){
      alert('કૃપા કરીને સાચો વીડિયો પસંદ કરો.');
      return;
    }
    if(file.size > 20 * 1024 * 1024){
      alert('વીડિયો 20 MB કરતાં નાનો હોવો જોઈએ.');
      return;
    }

    try {
      alert('વીડિયો અપલોડ થઈ રહ્યો છે, થોડી રાહ જુઓ...');
      const storageRef = ref(storage, 'reels/' + Date.now() + '_' + file.name);
      const snapshot = await uploadBytes(storageRef, file);
      const videoUrl = await getDownloadURL(snapshot.ref);

      await addDoc(collection(db, "reels"), {
        title,
        desc,
        videoUrl,
        uid: currentUser.uid,
        likes: [],
        createdAt: serverTimestamp()
      });

      form.reset();
      dialog.close();
      loadReels();
      alert('વીડિયો સફળતાપૂર્વક અપલોડ થઈ ગયો!');
    } catch (error) {
      console.error("Upload error: ", error);
      alert('વીડિયો અપલોડ કરવામાં ભૂલ થઈ છે.');
    }
  });

  async function loadReels() {
    feed.replaceChildren();
    const q = query(collection(db, "reels"), orderBy("createdAt", "desc"));
    const querySnapshot = await getDocs(q);

    if (querySnapshot.empty) {
      feed.innerHTML = '<div class="empty">હજુ કોઈ વીડિયો નથી.<br>＋ Upload દબાવીને વીડિયો ઉમેરો.</div>';
      return;
    }

    querySnapshot.forEach((documentSnapshot) => {
      const reel = documentSnapshot.data();
      const reelId = documentSnapshot.id;

      const card = document.createElement('article');
      card.className = 'card';

      const video = document.createElement('video');
      video.src = reel.videoUrl;
      video.controls = true;
      video.playsInline = true;
      video.preload = 'metadata';

      const details = document.createElement('div');
      details.className = 'details';

      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = reel.title;

      const desc = document.createElement('div');
      desc.className = 'desc';
      desc.textContent = reel.desc;

      const actions = document.createElement('div');
      actions.className = 'actions';

      const likesArray = reel.likes || [];
      const hasLiked = currentUser && likesArray.includes(currentUser.uid);

      const like = document.createElement('button');
      like.className = 'like' + (hasLiked ? ' active' : '');
      like.textContent = (hasLiked ? '♥ ' : '♡ ') + likesArray.length + ' Like';
      
      like.onclick = async () => {
        if (!currentUser) return;
        const reelRef = doc(db, "reels", reelId);
        if (hasLiked) {
          await updateDoc(reelRef, { likes: arrayRemove(currentUser.uid) });
        } else {
          await updateDoc(reelRef, { likes: arrayUnion(currentUser.uid) });
        }
        loadReels();
      };

      actions.append(like);

      // જો વીડિયો અપલોડ કરનાર ખુદ આ યૂઝર હોય અથવા તમે એડમિન હોવ, તો જ ડિલીટ બટન દેખાય
      if (currentUser && (reel.uid === currentUser.uid || currentUser.uid === ADMIN_UID)) {
        const remove = document.createElement('button');
        remove.className = 'delete';
        remove.textContent = 'Remove';
        remove.onclick = async () => {
          if (confirm('શું તમે આ વીડિયો ડિલીટ કરવા માંગો છો?')) {
            await deleteDoc(doc(db, "reels", reelId));
            loadReels();
          }
        };
        actions.append(remove);
      }

      details.append(title, desc, actions);
      card.append(video, details);
      feed.append(card);
    });
  }
</script>
</body>
</html>
